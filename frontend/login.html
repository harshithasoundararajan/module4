<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlogSpace - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="brand">BlogSpace</a>
    <button class="hamburger" id="hamburger">&#9776;</button>
    <div class="nav-links" id="navLinks"></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to write and manage your posts.</p>
    <div class="msg" id="loginMsg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>
    <div class="switch">Don't have an account? <a href="register.html">Sign up</a></div>
  </div>
</div>

<script src="app.js"></script>
<script>initNav('login');</script>
</body>
</html>
